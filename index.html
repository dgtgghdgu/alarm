<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ 警报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
            background: #0a0a0a;
            overflow: hidden;
        }
        .bg-pulse {
            position: fixed; inset: 0; z-index: 0;
            animation: bgFlash 0.8s ease-in-out infinite;
        }
        @keyframes bgFlash {
            0%, 100% { background-color: rgba(220, 38, 38, 0); }
            50% { background-color: rgba(220, 38, 38, 0.25); }
        }
        .container { position: relative; z-index: 1; text-align: center; }
        .icon { font-size: 64px; animation: iconPulse 0.8s ease-in-out infinite; }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .title {
            color: #f87171; font-size: 28px; font-weight: 700;
            margin-top: 16px; letter-spacing: 6px;
            animation: textBlink 0.8s step-end infinite;
        }
        @keyframes textBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .status { color: #64748b; font-size: 13px; margin-top: 16px; }
        .status.ok { color: #22c55e; }

        .unlock-overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.85);
            align-items: center; justify-content: center;
            flex-direction: column; gap: 20px; cursor: pointer;
        }
        .unlock-overlay.visible { display: flex; }
        .unlock-overlay .big-btn {
            width: 180px; height: 180px; border-radius: 50%;
            border: 3px solid #f87171;
            background: radial-gradient(circle at 40% 35%, #991b1b, #450a0a);
            color: #fca5a5; font-size: 20px; font-weight: 700;
            cursor: pointer; letter-spacing: 2px;
            animation: btnGlow 1.5s ease-in-out infinite;
        }
        @keyframes btnGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(220,38,38,0.3); }
            50% { box-shadow: 0 0 80px rgba(220,38,38,0.6); }
        }
        .unlock-overlay .hint { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="bg-pulse"></div>
    <div class="unlock-overlay" id="unlockOverlay" onclick="manualPlay()">
        <button class="big-btn" onclick="manualPlay()">点击启动<br>警报声</button>
        <div class="hint">浏览器要求点击一次才能播放声音</div>
    </div>
    <div class="container">
        <div class="icon">🚨</div>
        <div class="title">警 报</div>
        <div class="status" id="status">正在启动...</div>
    </div>

    <script>
        // ====== 生成工业报警器 WAV 音频数据 ======
        function generateSirenWAV() {
            var sampleRate = 44100;
            var duration = 3;  // 3秒一段，loop播放
            var numSamples = sampleRate * duration;
            var buffer = new Float32Array(numSamples);

            for (var i = 0; i < numSamples; i++) {
                var t = i / sampleRate;

                // 扫频：在 1000Hz ~ 2600Hz 之间来回扫，每秒2.5个来回
                var sweep = Math.sin(2 * Math.PI * 2.5 * t);
                var freq = 1800 + sweep * 800;

                // 主音：锯齿波
                var phase1 = (freq * t) % 1;
                var saw = 2 * phase1 - 1;

                // 高频叠加：方波 2400Hz 基础 + 扫频偏移
                var freq2 = 2400 + sweep * 500;
                var phase2 = (freq2 * t) % 1;
                var square = phase2 < 0.5 ? 1 : -1;

                // 混合
                var mixed = saw * 0.65 + square * 0.35;

                // 脉冲调制：每秒6次断续
                var pulse = Math.sin(2 * Math.PI * 6 * t) > 0 ? 1.0 : 0.15;

                buffer[i] = mixed * pulse * 0.45;  // 总音量
            }

            // 编码为 16-bit PCM WAV
            var numChannels = 1;
            var bitsPerSample = 16;
            var byteRate = sampleRate * numChannels * bitsPerSample / 8;
            var blockAlign = numChannels * bitsPerSample / 8;
            var dataSize = numSamples * blockAlign;
            var headerSize = 44;
            var wav = new ArrayBuffer(headerSize + dataSize);
            var view = new DataView(wav);

            function writeString(offset, str) {
                for (var j = 0; j < str.length; j++) {
                    view.setUint8(offset + j, str.charCodeAt(j));
                }
            }

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);          // PCM
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            // 写入采样数据
            var offset = 44;
            for (var k = 0; k < numSamples; k++) {
                var sample = Math.max(-1, Math.min(1, buffer[k]));
                var intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(offset, intSample, true);
                offset += 2;
            }

            return new Blob([wav], { type: 'audio/wav' });
        }

        // ====== 播放逻辑 ======
        var audioEl = null;
        var playing = false;

        function createAudio() {
            var blob = generateSirenWAV();
            var url = URL.createObjectURL(blob);
            audioEl = document.createElement('audio');
            audioEl.src = url;
            audioEl.loop = true;
            audioEl.autoplay = true;
            audioEl.setAttribute('playsinline', '');
            audioEl.volume = 1.0;
            document.body.appendChild(audioEl);
            return audioEl;
        }

        function markPlaying() {
            playing = true;
            document.getElementById('status').textContent = '🔊 警报播放中';
            document.getElementById('status').className = 'status ok';
            document.getElementById('unlockOverlay').classList.remove('visible');
        }

        function showBlocked() {
            document.getElementById('status').textContent = '⚠ 等待点击启动';
            document.getElementById('status').className = 'status';
            document.getElementById('unlockOverlay').classList.add('visible');
        }

        function manualPlay() {
            if (playing) return;
            if (!audioEl) createAudio();
            var p = audioEl.play();
            if (p && p.then) {
                p.then(markPlaying).catch(function() {});
            }
        }

        // ====== 启动 ======
        window.addEventListener('load', function() {
            createAudio();

            // 尝试播放
            var playPromise = audioEl.play();
            if (playPromise && playPromise.then) {
                playPromise.then(function() {
                    markPlaying();
                }).catch(function() {
                    showBlocked();
                });
            }

            // 双保险：500ms后检查
            setTimeout(function() {
                if (!playing) {
                    if (!audioEl.paused) {
                        markPlaying();
                    } else {
                        showBlocked();
                    }
                }
            }, 600);

            // 任何交互自动触发
            ['click','touchstart','mousedown','keydown','mousemove'].forEach(function(evt) {
                document.addEventListener(evt, function handler() {
                    if (!playing) manualPlay();
                    document.removeEventListener(evt, handler);
                });
            });
        });
    </script>
</body>
</html>
