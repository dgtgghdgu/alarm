<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ 警报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
            background: #0a0a0a;
            overflow: hidden;
            cursor: default;
        }
        .bg-pulse {
            position: fixed; inset: 0; z-index: 0;
            animation: bgFlash 1.2s ease-in-out infinite;
        }
        @keyframes bgFlash {
            0%, 100% { background-color: rgba(220, 38, 38, 0); }
            50% { background-color: rgba(220, 38, 38, 0.18); }
        }
        .container { position: relative; z-index: 1; text-align: center; }
        .icon {
            font-size: 64px;
            animation: iconPulse 1.2s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .title {
            color: #f87171; font-size: 28px; font-weight: 700;
            margin-top: 16px; letter-spacing: 6px;
            animation: textBlink 1s step-end infinite;
        }
        @keyframes textBlink {
            0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
        }
        .status {
            color: #64748b; font-size: 13px; margin-top: 16px;
            transition: color 0.3s;
        }
        .status.ok { color: #22c55e; }
        .status.blocked { color: #fbbf24; }

        /* 全屏可点击覆盖层 —— 浏览器拦截时显示 */
        .unlock-overlay {
            display: none;
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.85);
            align-items: center; justify-content: center;
            flex-direction: column; gap: 20px;
            cursor: pointer;
        }
        .unlock-overlay.visible { display: flex; }
        .unlock-overlay .big-btn {
            width: 180px; height: 180px; border-radius: 50%;
            border: 3px solid #f87171;
            background: radial-gradient(circle at 40% 35%, #991b1b, #450a0a);
            color: #fca5a5; font-size: 20px; font-weight: 700;
            cursor: pointer; letter-spacing: 2px;
            box-shadow: 0 0 50px rgba(220,38,38,0.4);
            animation: btnGlow 2s ease-in-out infinite;
        }
        @keyframes btnGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(220,38,38,0.3); }
            50% { box-shadow: 0 0 80px rgba(220,38,38,0.6); }
        }
        .unlock-overlay .hint {
            color: #94a3b8; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="bg-pulse"></div>

    <!-- 拦截时显示的全屏点击层 -->
    <div class="unlock-overlay" id="unlockOverlay" onclick="unlockAndPlay()">
        <button class="big-btn" onclick="unlockAndPlay()">点击启动<br>警报声</button>
        <div class="hint">浏览器要求点击一次才能播放声音</div>
    </div>

    <div class="container">
        <div class="icon">🚨</div>
        <div class="title">警 报</div>
        <div class="status" id="status">正在启动...</div>
    </div>

    <script>
        let audioCtx = null;
        let alarmTimer = null;
        let playing = false;

        function makeBeep() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const t = audioCtx.currentTime;

            // 高音
            const o1 = audioCtx.createOscillator();
            const g1 = audioCtx.createGain();
            o1.type = 'square';
            o1.frequency.setValueAtTime(880, t);
            o1.frequency.setValueAtTime(1, t + 0.45);
            o1.frequency.setValueAtTime(1100, t + 0.6);
            o1.frequency.setValueAtTime(1, t + 1.05);
            g1.gain.setValueAtTime(0.18, t);
            g1.gain.linearRampToValueAtTime(0, t + 0.45);
            g1.gain.setValueAtTime(0.18, t + 0.6);
            g1.gain.linearRampToValueAtTime(0, t + 1.05);
            o1.connect(g1); g1.connect(audioCtx.destination);
            o1.start(t); o1.stop(t + 1.2);

            // 低音
            const o2 = audioCtx.createOscillator();
            const g2 = audioCtx.createGain();
            o2.type = 'sawtooth';
            o2.frequency.setValueAtTime(220, t);
            o2.frequency.setValueAtTime(1, t + 0.45);
            o2.frequency.setValueAtTime(280, t + 0.6);
            o2.frequency.setValueAtTime(1, t + 1.05);
            g2.gain.setValueAtTime(0.07, t);
            g2.gain.linearRampToValueAtTime(0, t + 0.45);
            g2.gain.setValueAtTime(0.07, t + 0.6);
            g2.gain.linearRampToValueAtTime(0, t + 1.05);
            o2.connect(g2); g2.connect(audioCtx.destination);
            o2.start(t); o2.stop(t + 1.2);
        }

        function startLoop() {
            if (playing) return;
            playing = true;
            makeBeep();
            alarmTimer = setInterval(makeBeep, 1200);
            document.getElementById('status').textContent = '🔊 警报播放中';
            document.getElementById('status').className = 'status ok';
            document.getElementById('unlockOverlay').classList.remove('visible');
        }

        function showBlocked() {
            document.getElementById('status').textContent = '⚠ 等待点击启动声音';
            document.getElementById('status').className = 'status blocked';
            document.getElementById('unlockOverlay').classList.add('visible');
        }

        function unlockAndPlay() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            audioCtx.resume().then(function() {
                startLoop();
            });
        }

        // ===== 页面加载后立刻尝试 =====
        window.addEventListener('load', function() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume().then(function() {
                    // 给浏览器 200ms 反应时间再检查真实状态
                    setTimeout(function() {
                        if (audioCtx.state === 'running') {
                            startLoop();
                        } else {
                            showBlocked();
                        }
                    }, 200);
                }).catch(function() {
                    showBlocked();
                });

                // 双保险：500ms 后再检查一次
                setTimeout(function() {
                    if (!playing) {
                        if (audioCtx.state === 'running') {
                            startLoop();
                        } else {
                            showBlocked();
                        }
                    }
                }, 500);
            } catch(e) {
                showBlocked();
            }

            // 任何交互都尝试解锁
            ['click','touchstart','mousedown','keydown'].forEach(function(evt) {
                document.addEventListener(evt, unlockAndPlay, { once: true });
            });
        });
    </script>
</body>
</html>
